<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markdown editor — web tests</title>
<link rel="stylesheet" href="../src/theme.css">
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 20px; }
  li { list-style: none; }
  .ok::before { content: "✓ "; color: #17864a; }
  .fail::before { content: "✗ "; color: #c02a2a; }
  .fail { color: #c02a2a; }
  .detail { opacity: .7; padding-left: 18px; }
  /* The sandbox has to be laid out for real: computed styles and selection only behave
     when the element is in the document and visible. */
  /* On screen, at a real position. `elementFromPoint` is viewport-relative, so an
     offscreen sandbox makes every hit-testing assertion silently vacuous. */
  #sandbox { width: 100%; max-width: 600px; border: 1px dashed #ccc; margin-top: 24px; }
  #sandbox::before { content: "sandbox"; font-size: 11px; opacity: .5; }
</style>
</head>
<body>
<h1 id="summary">running…</h1>
<ul id="list"></ul>
<div id="sandbox"></div>
<script type="module">
// Cache-busted on purpose: browsers cache ES modules hard, and a test page that
// silently runs yesterday's assertions is worse than no test page.
const { run } = await import(`./tests.js?v=${Date.now()}`);
const results = await run();
const failed = results.filter(r => !r.ok);
document.getElementById('list').innerHTML = results.map(r =>
  `<li class="${r.ok ? 'ok' : 'fail'}">${r.name}${r.detail ? `<div class="detail">${r.detail}</div>` : ''}</li>`
).join('');
document.getElementById('summary').textContent =
  `${results.length - failed.length}/${results.length} passed`;
window.__results = { total: results.length, failed: failed.map(f => `${f.name}: ${f.detail}`) };
</script>
</body>
</html>
